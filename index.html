<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3514 獎金賽 · 對賽計分</title>
<style>
  :root {
    --bg:#07080d; --card:#12141c; --line:#2a3144;
    --gold:#e8c36a; --gold2:#f5e2a8; --text:#f3f4f8; --muted:#9aa3b5;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:
      radial-gradient(900px 400px at 15% -10%, #3a1a12 0%, transparent 50%),
      radial-gradient(800px 380px at 95% 0%, #10203a 0%, transparent 45%),
      var(--bg);
    color:var(--text); min-height:100vh;
  }
  header{text-align:center;padding:26px 16px 6px}
  header h1{
    margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:2px;
    background:linear-gradient(180deg,#fff6d2,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header p{color:var(--muted);margin:8px 0 0}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}
  .prize{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
  .prize div,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .prize b{display:block;color:var(--gold);font-size:18px}
  .prize span{color:var(--muted);font-size:12px}
  .flow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;color:var(--gold2);font-weight:700;margin-bottom:16px}
  .flow i{color:var(--muted);font-style:normal;font-weight:400}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  h2{margin:0 0 12px;color:var(--gold);font-size:18px}
  .names{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;margin-bottom:7px}
  .badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#1c2230;font-size:12px;font-weight:800}
  input[type="text"]{
    width:100%;background:#0c0e14;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:15px;
  }
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  th,td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:center}
  th{color:var(--muted);font-weight:600}
  td.left,th.left{text-align:left}
  .scorebox{display:flex;align-items:center;justify-content:center;gap:3px}
  .n{min-width:28px;text-align:center;font-weight:800;font-size:18px;color:var(--gold2)}
  .pm{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
    background:#0c0e14;color:var(--gold);font-size:18px;font-weight:800;
    cursor:pointer;line-height:1;
  }
  .pm:active{transform:scale(.94)}
  .vs{color:var(--muted);font-size:12px;padding:0 4px}
  .tot{color:var(--gold);font-weight:800}
  .win{color:#7dffb3;font-weight:800}
  .out{opacity:.45}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  button.act{background:linear-gradient(180deg,#f0d27a,#c49a3a);border:0;color:#1a1406;font-weight:800;padding:10px 16px;border-radius:10px;cursor:pointer}
  button.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line);font-weight:800;padding:10px 16px;border-radius:10px;cursor:pointer}
  .bracket{display:grid;grid-template-columns:1fr 56px 1fr 56px 1fr;gap:8px}
  .col{display:flex;flex-direction:column;gap:8px;justify-content:space-around}
  .slot{background:#0c0e14;border:1px solid var(--line);border-radius:12px;padding:10px}
  .slot.gold{border-color:var(--gold)}
  .name{font-weight:800}
  .meta{color:var(--muted);font-size:12px}
  .arrow{display:grid;place-items:center;color:var(--gold);font-size:22px}
  .rankbox{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .note{color:var(--muted);font-size:13px;line-height:1.65;margin-top:12px}
  @media(max-width:860px){
    .grid2,.prize,.bracket,.rankbox{grid-template-columns:1fr}
    .arrow{transform:rotate(90deg);min-height:24px}
  }
</style>
</head>
<body>
<header>
  <h1>3514 獎金賽</h1>
  <p>對賽計分 · 勝場優先晉級 · ＋－加減分數</p>
</header>
<div class="wrap">
  <div class="prize">
    <div><span>報名費</span><b>$300 × 8</b></div>
    <div><span>獎池</span><b>$2,400</b></div>
    <div><span>冠軍 50%</span><b>$1,200</b></div>
    <div><span>亞 / 季</span><b>$720 / $480</b></div>
  </div>
  <div class="flow">8人 <i>→</i> 分2組 <i>→</i> 組內對賽 <i>→</i> 勝場優先出2 <i>→</i> 交叉準決（4分） <i>→</i> 決賽／季軍賽（7分）</div>

  <div class="grid2">
    <section class="card" id="ga"></section>
    <section class="card" id="gb"></section>
  </div>

  <div class="actions">
    <button class="act" onclick="paint()">更新路線圖</button>
    <button class="ghost" onclick="demo()">示範</button>
    <button class="ghost" onclick="wipe()">清空</button>
  </div>

  <section class="card">
    <h2>4強交叉淘汰</h2>
    <div id="finalMatches"></div>
    <div id="finalTable"></div>
  </section>

  <section class="card" style="margin-top:14px">
    <h2>晉級路線圖</h2>
    <div class="bracket">
      <div class="col" id="c1"></div>
      <div class="arrow">→</div>
      <div class="col" id="c2"></div>
      <div class="arrow">→</div>
      <div class="col" id="c3"></div>
    </div>
    <div class="rankbox" id="podium"></div>
    <p class="note">小組先比勝場再比總分、分差，每組出2。4強交叉：A組首名打B組次名、A組次名打B組首名（4分制）。勝者入決賽（7分制），敗者打季軍賽（7分制）。</p>
  </section>
</div>
<script>
const KEY="bb3514-matches-v4";
const pairs=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
const emptyGroup=()=>({names:["","","",""], m:pairs.map(()=>[0,0])});
function emptyF(){return {s1:[0,0], s2:[0,0], fin:[0,0], third:[0,0]}}
function empty(){return {A:emptyGroup(),B:emptyGroup(),F:emptyF()}}
let S=load();
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!x) return empty();
    if(!x.F || !x.F.s1) x.F=emptyF();
    return Object.assign(empty(),x);
  }catch{return empty()}
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function esc(s){return String(s||"").replace(/"/g,"&quot;")}

function stats(g){
  const pts=[0,0,0,0], wins=[0,0,0,0], diff=[0,0,0,0];
  pairs.forEach((p,i)=>{
    const a=num(g.m[i][0]), b=num(g.m[i][1]);
    pts[p[0]]+=a; pts[p[1]]+=b;
    diff[p[0]]+=a-b; diff[p[1]]+=b-a;
    if(a>b) wins[p[0]]++;
    else if(b>a) wins[p[1]]++;
  });
  return [0,1,2,3].map(i=>({
    i, name:g.names[i]||("#"+(i+1)), pts:pts[i], wins:wins[i], diff:diff[i]
  })).sort((x,y)=> y.wins-x.wins || y.pts-x.pts || y.diff-x.diff || x.i-y.i);
}

function bump(g,i,side,d){
  S[g].m[i][side]=Math.max(0,num(S[g].m[i][side])+d);
  save(); paint();
}
function bumpKO(key,side,d){
  S.F[key][side]=Math.max(0,num(S.F[key][side])+d);
  save(); paint();
}
function setName(g,i,v){S[g].names[i]=v;save()}

function scoreCtrl(val, fn){
  return '<button class="pm" type="button" onclick="'+fn+'(-1))">−</button>'+
    '<span class="n">'+val+'</span>'+
    '<button class="pm" type="button" onclick="'+fn+'(1))">+</button>';
}

function groupView(key,title){
  const g=S[key], r=stats(g);
  let html="<h2>"+title+"</h2>";
  for(let i=0;i<4;i++){
    html+='<div class="names"><div class="badge">'+key+(i+1)+'</div>'+
      '<input type="text" value="'+esc(g.names[i])+'" placeholder="'+key+(i+1)+' 名" onchange="setName(\''+key+'\','+i+',this.value);paint()"></div>';
  }
  html+='<table><thead><tr><th class="left">對賽</th><th>比分</th></tr></thead><tbody>';
  pairs.forEach((p,i)=>{
    const n1=g.names[p[0]]||(key+(p[0]+1));
    const n2=g.names[p[1]]||(key+(p[1]+1));
    html+='<tr><td class="left">'+n1+' vs '+n2+'</td><td><div class="scorebox">'+
      scoreCtrl(g.m[i][0],"bump('"+key+"',"+i+",0,") +
      '<span class="vs">比</span>'+
      scoreCtrl(g.m[i][1],"bump('"+key+"',"+i+",1,") +
      '</div></td></tr>';
  });
  html+='</tbody></table><table><thead><tr><th class="left">選手</th><th>勝場</th><th>總分</th><th>分差</th><th></th></tr></thead><tbody>';
  r.forEach((x,idx)=>{
    html+='<tr class="'+(idx>1?"out":"")+'"><td class="left">'+x.name+'</td><td class="win">'+x.wins+'</td><td class="tot">'+x.pts+'</td><td>'+x.diff+'</td><td>'+(idx<2?"出線":"")+'</td></tr>';
  });
  return html+"</tbody></table>";
}

function winner(score, p0, p1){
  const a=num(score[0]), b=num(score[1]);
  if(a>b) return {win:p0, lose:p1, a:a, b:b, done:true};
  if(b>a) return {win:p1, lose:p0, a:a, b:b, done:true};
  return {win:null, lose:null, a:a, b:b, done:false};
}

function matchRow(title, p0, p1, key){
  const sc=S.F[key];
  return '<tr><td class="left"><b>'+title+'</b><br>'+p0.name+' vs '+p1.name+'</td><td><div class="scorebox">'+
    scoreCtrl(sc[0],"bumpKO('"+key+"',0,") +
    '<span class="vs">比</span>'+
    scoreCtrl(sc[1],"bumpKO('"+key+"',1,") +
    '</div></td></tr>';
}

function paint(){
  document.getElementById("ga").innerHTML=groupView("A","A組");
  document.getElementById("gb").innerHTML=groupView("B","B組");
  const A=stats(S.A), B=stats(S.B);
  const a1=A[0], a2=A[1], b1=B[0], b2=B[1];
  // 交叉：A首 vs B次；A次 vs B首
  const s1=winner(S.F.s1, a1, b2);
  const s2=winner(S.F.s2, a2, b1);
  const w1=s1.done?s1.win:{name:"準決1勝者", wins:0, pts:0};
  const l1=s1.done?s1.lose:{name:"準決1敗者", wins:0, pts:0};
  const w2=s2.done?s2.win:{name:"準決2勝者", wins:0, pts:0};
  const l2=s2.done?s2.lose:{name:"準決2敗者", wins:0, pts:0};
  const fin=winner(S.F.fin, w1, w2);
  const third=winner(S.F.third, l1, l2);

  let fm='<table><thead><tr><th class="left">對賽</th><th>比分</th></tr></thead><tbody>';
  fm+=matchRow("準決① 4分制　A首 vs B次", a1, b2, "s1");
  fm+=matchRow("準決② 4分制　A次 vs B首", a2, b1, "s2");
  fm+=matchRow("決賽 7分制", w1, w2, "fin");
  fm+=matchRow("季軍賽 7分制", l1, l2, "third");
  fm+='</tbody></table>';
  document.getElementById("finalMatches").innerHTML=fm;

  const champ=fin.done?fin.win:null;
  const second=fin.done?fin.lose:null;
  const bronze=third.done?third.win:null;
  const fourth=third.done?third.lose:null;
  let ft='<table><thead><tr><th class="left">名次</th><th>選手</th><th>結果</th></tr></thead><tbody>';
  ft+='<tr><td class="tot">冠軍 $1,200</td><td class="left">'+(champ?champ.name:"待定")+'</td><td>'+(fin.done?(fin.win.name+" 勝"):"—")+'</td></tr>';
  ft+='<tr><td>亞軍 $720</td><td class="left">'+(second?second.name:"待定")+'</td><td>—</td></tr>';
  ft+='<tr><td>季軍 $480</td><td class="left">'+(bronze?bronze.name:"待定")+'</td><td>'+(third.done?(third.win.name+" 勝"):"—")+'</td></tr>';
  ft+='<tr><td>殿軍</td><td class="left">'+(fourth?fourth.name:"待定")+'</td><td>—</td></tr>';
  document.getElementById("finalTable").innerHTML=ft;

  document.getElementById("c1").innerHTML=
    slot(a1,"A組首名")+slot(a2,"A組次名")+slot(b1,"B組首名")+slot(b2,"B組次名");
  document.getElementById("c2").innerHTML=
    '<div class="slot '+(s1.done?"gold":"")+'"><div class="name">準決① 4分</div><div class="meta">'+a1.name+' vs '+b2.name+'<br>'+S.F.s1[0]+' : '+S.F.s1[1]+(s1.done?" → "+s1.win.name:"")+'</div></div>'+
    '<div class="slot '+(s2.done?"gold":"")+'"><div class="name">準決② 4分</div><div class="meta">'+a2.name+' vs '+b1.name+'<br>'+S.F.s2[0]+' : '+S.F.s2[1]+(s2.done?" → "+s2.win.name:"")+'</div></div>'+
    '<div class="slot '+(fin.done?"gold":"")+'"><div class="name">決賽 7分</div><div class="meta">'+w1.name+' vs '+w2.name+'</div></div>'+
    '<div class="slot '+(third.done?"gold":"")+'"><div class="name">季軍賽 7分</div><div class="meta">'+l1.name+' vs '+l2.name+'</div></div>';
  const lab=[["冠軍 $1,200",champ],["亞軍 $720",second],["季軍 $480",bronze],["殿軍",fourth]];
  document.getElementById("c3").innerHTML=lab.map((x,i)=>
    '<div class="slot '+(i===0&&x[1]?"gold":"")+'"><div class="name">'+x[0]+'</div><div class="meta">'+(x[1]?x[1].name:"待定")+'</div></div>'
  ).join("");
  document.getElementById("podium").innerHTML=[0,1,2].map(i=>
    '<div class="card"><div class="meta">'+lab[i][0]+'</div><div class="name">'+(lab[i][1]?lab[i][1].name:"待定")+'</div></div>'
  ).join("");
}
function slot(p,tag){
  return '<div class="slot"><div class="name">'+(p.name||"—")+'</div><div class="meta">'+tag+' · 勝'+p.wins+' · 分'+p.pts+'</div></div>';
}
function wipe(){S=empty();save();paint()}
function demo(){
  S={
    A:{names:["龍","炎","風","岩"],m:[[3,1],[2,2],[3,0],[1,2],[2,1],[3,1]]},
    B:{names:["海","雷","影","光"],m:[[2,1],[3,0],[1,2],[2,2],[3,1],[0,3]]},
    F:{s1:[4,2], s2:[1,4], fin:[7,5], third:[7,3]}
  };
  save();paint();
}
paint();
</script>
</body>
</html>
